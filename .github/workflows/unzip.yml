name: Auto Unzip Source

on:
  workflow_dispatch:
  push:
    paths: ['*.zip']

permissions:
  contents: write
  workflows: write   # ✅ 关键：允许修改 workflow 文件

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -o *.zip -d .
          rm -f *.zip
          ls -la

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "auto: extract source from ZIP"
            git push
          else
            echo "No changes to commit"
          fi
