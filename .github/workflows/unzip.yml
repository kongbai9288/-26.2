name: Extract Source
on:
  workflow_dispatch:
  push:
    paths: ['LowYSwampHut-fixed.zip']
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and Clean
        run: |
          unzip -o LowYSwampHut-fixed.zip -d .
          rm LowYSwampHut-fixed.zip
      - name: Commit Source Only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 关键：只添加源码，不添加 .github/ 下的任何文件（避免冲突）
          git add src/ build.gradle settings.gradle gradle/ README-FIXED.md
          git diff --cached --quiet || git commit -m "chore: update source code"
          git push
