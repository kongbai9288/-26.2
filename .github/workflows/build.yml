name: Auto Unzip Source

on:
  workflow_dispatch:
  push:
    paths:
      - 'LowYSwampHut-fixed.zip'

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect and extract zip
        run: |
          echo "=== ZIP 内部结构 ==="
          unzip -l LowYSwampHut-fixed.zip | head -20
          
          mkdir -p $RUNNER_TEMP/extracted
          unzip -o LowYSwampHut-fixed.zip -d $RUNNER_TEMP/extracted
          
          echo "=== 解压后的目录结构 ==="
          ls -la $RUNNER_TEMP/extracted
          
          # 自动探测 build.gradle 所在的真实目录
          SRC_DIR=$(find $RUNNER_TEMP/extracted -maxdepth 3 -name "build.gradle" | head -1 | xargs dirname)
          echo "找到源码目录: $SRC_DIR"
          
          # 把源码复制到仓库根
          cp -rf "$SRC_DIR/." .
          
          echo "=== 仓库根目录现状 ==="
          ls -la

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "auto: extract source from ZIP" || echo "nothing to commit"
          git push
