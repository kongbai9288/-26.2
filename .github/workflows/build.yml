name: Auto Unzip Source
on:
  workflow_dispatch:
  push:
    paths: ['*.zip']
permissions: { contents: write }
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o *.zip -d .  # 直接解压到当前目录（ZIP根=仓库根）
          rm -f *.zip           # 删掉ZIP避免下次触发
          ls -la                # 打印结果确认
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "auto: extract source" && git push
