name: 搜索指定种子（v26.2）
run-name: 搜索种子 ${{ inputs.seed }}（MC ${{ inputs.version }}）

on:
  workflow_dispatch:
    inputs:
      seed:
        description: '目标种子值（支持负数/十六进制）'
        required: true
        default: '-1421144132636065691'
        type: string
      version:
        description: 'Minecraft 版本'
        required: true
        default: '26.2'
        type: string
      max_y:
        description: '搜索的最大Y坐标（越低越容易找到低Y小屋）'
        required: false
        default: '-40'
        type: string
      threads:
        description: '搜索线程数（建议2-8，不超过CPU核心数）'
        required: false
        default: '4'
        type: string
      check_gen:
        description: '是否开启精确生成校验（更慢但更准确）'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: write  # 用于上传运行结果

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 设置JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 缓存Gradle依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 设置Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 构建可执行Jar
        run: gradle shadowJar --no-daemon

      - name: 验证Jar文件
        run: |
          if [ ! -f build/libs/LowYSwampHut.jar ]; then
            echo "❌ 构建失败：未找到LowYSwampHut.jar"
            exit 1
          fi
          echo "✅ Jar构建成功，大小：$(du -h build/libs/LowYSwampHut.jar | cut -f1)"

      - name: 开始搜索种子
        run: |
          echo "========================================"
          echo "开始搜索参数："
          echo "种子：${{ inputs.seed }}"
          echo "版本：${{ inputs.version }}"
          echo "最大Y：${{ inputs.max_y }}"
          echo "线程数：${{ inputs.threads }}"
          echo "精确校验：${{ inputs.check_gen }}"
          echo "========================================"
          
          # 构造运行命令（完全适配你项目的CmdLineRunner参数）
          CMD="java -jar build/libs/LowYSwampHut.jar \
            --seed ${{ inputs.seed }} \
            --version ${{ inputs.version }} \
            --max-y ${{ inputs.max_y }} \
            --threads ${{ inputs.threads }} \
            --output search-result.txt"
          
          # 如果开启精确校验，添加对应参数
          if [ "${{ inputs.check_gen }}" = "true" ]; then
            CMD="$CMD --check-gen"
          fi
          
          echo "执行命令：$CMD"
          eval $CMD

      - name: 上传搜索结果
        if: always()  # 即使搜索失败也上传日志
        uses: actions/upload-artifact@v4
        with:
          name: 种子${{ inputs.seed }}-搜索结果
          path: |
            search-result.txt
          retention-days: 7  # 结果保留7天，可自行下载
